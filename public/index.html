<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kirimi</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header class="top">
  <a class="logo" href="/">Kiri<span>mi</span></a>
  <span class="muted">Webページを、クリックでAPIに。</span>
  <span class="spacer"></span>
  <a class="btn primary" href="/editor">＋ 新しいAPI</a>
</header>
<main id="main"><p class="muted">読み込み中…</p></main>
<script type="module">
import { api, ensureLogin, esc, fmtTime } from '/common.js';
const SCHED = { manual: '手動', '15min': '15分ごと', hourly: '1時間ごと', daily: '毎日', weekly: '毎週' };

async function load() {
  const list = await api('/apis');
  const main = document.getElementById('main');
  if (!list.length) {
    main.innerHTML = `<div class="card empty"><p>まだAPIがありません。</p><p>URLを開いて、取りたいデータをクリックするだけでAPIができます。</p><a class="btn primary" href="/editor">最初のAPIを作る</a></div>`;
    return;
  }
  main.innerHTML = `<div class="card"><table><thead><tr><th>名前</th><th>対象</th><th>更新頻度</th><th>最終実行</th><th>件数</th></tr></thead><tbody>
    ${list.map((a) => `<tr>
      <td><a href="/detail?id=${a.id}"><b>${esc(a.name)}</b></a></td>
      <td class="mono" style="max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(a.config.url)}</td>
      <td>${SCHED[a.schedule] || a.schedule}</td>
      <td>${a.running ? '<span class="pill">実行中</span>' : `${fmtTime(a.last_run_at)} ${a.last_status ? `<span class="pill ${a.last_status === 'ok' ? 'ok' : 'err'}">${a.last_status}</span>` : ''}`}</td>
      <td>${a.last_rows ?? '—'}</td></tr>`).join('')}
    </tbody></table></div>`;
}
if (await ensureLogin()) load().catch((e) => (document.getElementById('main').textContent = e.message));
</script>
</body>
</html>
